name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize without a backend
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        run: terraform validate -no-color

  scripts:
    name: Provisioning scripts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run ShellCheck
        run: shellcheck scripts/*.sh

      - name: Parse dashboard JSON
        shell: python
        run: |
          import json
          from pathlib import Path

          for dashboard in Path("dashboards").glob("*.json"):
              with dashboard.open(encoding="utf-8") as stream:
                  json.load(stream)
              print(f"validated {dashboard}")

  powershell:
    name: PowerShell syntax
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object {
                Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)"
              }
            }
          }

          if ($failed) {
            exit 1
          }
